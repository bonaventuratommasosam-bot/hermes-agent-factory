# Agent Pack: Dev Shop
# Generated by Hermes Agent Factory

name: dev-shop-pack
version: 1.0.0
description: >
  Complete development team — code review & architecture,
  security audit, and R&D/skill development. Three agents
  that review, secure, and improve your codebase.

agents:
  - name: frank
    profile: agents/frank
    role: Lead Developer & Architect
    triggers:
      - "code|PR|review|refactor|architettura|deploy|bug|fix"
      - "scrivi|implementa|build|test"
    skills:
      - code-review
      - pr-analysis
      - architecture-review
    cron:
      - schedule: "on push"
        prompt: "Review new PRs. Check architecture, complexity, test coverage."

  - name: sentinel
    profile: agents/sentinel
    role: Security Auditor
    triggers:
      - "security|vulnerabilità|scan|secret|OWASP|CVE|audit"
    skills:
      - secret-scan
      - dependency-audit
      - owasp-check
    cron:
      - schedule: "every 6h"
        prompt: "Scan all repos for secrets and vulnerabilities. Flag critical."
      - schedule: "0 9 * * 1"
        prompt: "Weekly CVE audit on all dependencies. Report critical updates."

  - name: wannabe
    profile: agents/wannabe
    role: R&D & Skill Incubator
    triggers:
      - "skill|plugin|migliora|ottimizza|idea|prototipo|test"
    skills:
      - skill-generator
      - test-writer
      - benchmark-runner
    cron:
      - schedule: "0 3 * * *"
        prompt: "Analyze agent logs. Propose skill improvements. Open PR if code change needed."

bus:
  type: filesystem
  path: /opt/hermesbro/packs/dev-shop/bus/
  routes:
    - from: frank
      to: sentinel
      on: "PR opened"
      action: "Security scan diff before merge"
    - from: sentinel
      to: frank
      on: "vulnerability found"
      action: "Flag PR lines for fix"
    - from: wannabe
      to: frank
      on: "skill improvement ready"
      action: "Review and merge to agent profile"

coordinator:
  name: machiavelli
  profile: agents/machiavelli
  role: Dev Team Orchestrator
  routing_rules:
    - keywords: ["code", "PR", "review", "architettura", "build"]
      route_to: frank
    - keywords: ["security", "vulnerability", "scan", "CVE", "audit"]
      route_to: sentinel
    - keywords: ["skill", "plugin", "improve", "optimize", "prototype"]
      route_to: wannabe
