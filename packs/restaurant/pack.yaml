# Agent Pack: Restaurant Management
# Generated by Hermes Agent Factory

name: restaurant-pack
version: 1.0.0
description: >
  Complete restaurant management system — inventory tracking,
  food cost calculation, accounting, and HACCP compliance.
  Three coordinated agents that share a message bus.

agents:
  - name: groot-brigata
    profile: agents/groot
    role: Inventory & Food Cost Manager
    triggers:
      - "inventory|stock|magazzino|food cost|menu|spesa|ordine fornitore"
      - "quanto costa|margine piatto|prezzo menu"
    skills:
      - inventory-tracker
      - food-cost
      - shopping-list
    cron:
      - schedule: "0 9 * * *"
        prompt: "Check inventory levels. Alert on items below par level. Generate shopping list."
      - schedule: "0 18 * * *"
        prompt: "Calculate daily food cost. Compare vs target %. Flag anomalies."

  - name: contabile
    profile: agents/contabile
    role: Accounting & Financial Controller
    triggers:
      - "contabilità|fattura|iva|bilancio|costo|ricavo|margine|tasse"
      - "quanto abbiamo|report finanziario|profit"
    skills:
      - revenue-tracker
      - cost-analysis
      - tax-calculator
    cron:
      - schedule: "0 9 * * 1"
        prompt: "Generate weekly revenue report. Compare vs last week. Highlight trends."
      - schedule: "0 9 1 * *"
        prompt: "Monthly P&L. Revenue, costs, margins, tax estimate."

  - name: lawrenzo
    profile: agents/lawrenzo
    role: HACCP & Compliance Officer
    triggers:
      - "haccp|igiene|sanità|controllo|ispezione|contratto|gdpr|privacy"
      - "documento haccp|checklist|non conformità"
    skills:
      - haccp-checklist
      - contract-review
      - gdpr-compliance
    cron:
      - schedule: "0 8 * * *"
        prompt: "Daily HACCP check. Temperature logs, cleaning schedule, staff hygiene."
      - schedule: "0 9 * * 1"
        prompt: "Weekly compliance audit. Check all HACCP logs, flag missing entries."

bus:
  type: filesystem
  path: /opt/hermesbro/packs/restaurant/bus/
  inbox: "{bus.path}/inbox/{agent}/"
  outbox: "{bus.path}/outbox/"
  routes:
    - from: groot-brigata
      to: contabile
      on: "food cost report ready"
      action: "Send cost data for P&L integration"
    - from: contabile
      to: groot-brigata
      on: "margin below target"
      action: "Request menu price review"
    - from: lawrenzo
      to: groot-brigata
      on: "HACCP non-compliance on storage"
      action: "Flag inventory item for review"

coordinator:
  name: el-froggo
  profile: agents/el-froggo
  role: Restaurant Team Lead
  triggers:
    - "report|riepilogo|stato|tutto ok|problema|emergenza"
  routing_rules:
    - keywords: ["inventario", "magazzino", "food cost", "menu", "spesa"]
      route_to: groot-brigata
    - keywords: ["contabilità", "fattura", "iva", "costi", "ricavi"]
      route_to: contabile
    - keywords: ["haccp", "igiene", "contratto", "gdpr", "ispezione"]
      route_to: lawrenzo
